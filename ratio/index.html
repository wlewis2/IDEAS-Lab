<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ratio Viewfinder</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ratio">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230A0C10'/%3E%3Ccircle cx='50' cy='50' r='26' fill='none' stroke='%23F0B24A' stroke-width='9'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0A0C10">
<style>
:root{
  --ground:#0A0C10; --surface:#151920; --surface-2:#1E242D; --line:#2A313C;
  --text:#E8ECF1; --muted:#8B95A3; --accent:#F0B24A; --accent-ink:#1A1204; --danger:#E5645A;
  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --radius:12px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--ground);color:var(--text);font-family:var(--font-ui);
  -webkit-text-size-adjust:100%;overscroll-behavior:none;touch-action:manipulation}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--ground)}
.stage{position:relative;flex:1 1 auto;min-height:0;background:#000;overflow:hidden}
#view{display:block;width:100%;height:100%;object-fit:contain;background:#000}
#src{position:absolute;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none}

.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;pointer-events:none;
  background:linear-gradient(rgba(10,12,16,.75),rgba(10,12,16,0))}
.hud .name{font-size:13px;font-weight:600;letter-spacing:.02em}
.hud .formula{font-family:var(--font-mono);font-size:12px;color:var(--muted);margin-top:2px}
.hud .stats{font-family:var(--font-mono);font-size:11px;color:var(--muted);text-align:right;line-height:1.5;
  font-variant-numeric:tabular-nums}
.hud .stats b{color:var(--text);font-weight:500}

.notice{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;
  background:rgba(10,12,16,.82)}
.notice .card{max-width:340px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 20px;text-align:center}
.notice h1{font-size:19px;margin:0 0 6px;font-weight:600;text-wrap:balance}
.notice p{margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.45}
.notice p.err{color:var(--danger)}
.notice p:last-child{margin-bottom:0}

.dock{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--line);
  padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.row.primary{justify-content:space-between}
.row.secondary{justify-content:space-between}
.row .group{display:flex;align-items:center;gap:8px}

.btn{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;
  font-size:14px;font-weight:500;min-height:42px;min-width:64px}
.btn:active{background:var(--line)}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;padding:12px 22px}
.btn:disabled{opacity:.4;cursor:default}
.shutter{width:64px;height:64px;border-radius:50%;background:var(--text);border:4px solid var(--surface);
  box-shadow:0 0 0 2px var(--text);padding:0;min-width:0}
.shutter:active{background:var(--muted)}
.shutter:disabled{opacity:.35}

.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:3px;gap:2px}
.seg button{background:transparent;border:0;border-radius:9px;padding:7px 12px;font-size:13px;font-weight:500;color:var(--muted);min-height:32px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.panel{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.ctl{display:flex;flex-direction:column;gap:6px}
.ctl .head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ctl label,.ctl .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ctl .val{font-family:var(--font-mono);font-size:12px;color:var(--text);font-variant-numeric:tabular-nums}
.ctl input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.small{font-size:12px;padding:6px 10px;min-height:30px;min-width:0}

.preview{position:fixed;inset:0;background:rgba(10,12,16,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;z-index:10}
.preview .imgs{display:flex;flex-direction:column;gap:10px;max-height:70vh;overflow:auto;width:100%;align-items:center}
.preview img{max-width:100%;max-height:60vh;border-radius:8px;border:1px solid var(--line)}
.preview p{margin:0;color:var(--muted);font-size:13px;text-align:center}
@media (prefers-reduced-motion:no-preference){.btn,.seg button{transition:background-color .12s,color .12s}}
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <video id="src" playsinline muted autoplay></video>
    <canvas id="view" width="16" height="9"></canvas>
    <div class="hud">
      <div>
        <div class="name">Ratio Viewfinder</div>
        <div class="formula">(G−B)/(R−G) → equalized gray</div>
      </div>
      <div class="stats" id="stats">—</div>
    </div>
    <div class="notice" id="notice">
      <div class="card">
        <h1>Live (G−B)/(R−G) view</h1>
        <p id="noticeText">Uses the rear camera. Each frame's (G−B)/(R−G) ratio image is histogram-equalized to grayscale; pixels with R−G ≤ 0 (ratio undefined) are shown black.</p>
        <p><button class="btn primary" id="startBtn">Start camera</button></p>
      </div>
    </div>
  </div>

  <div class="dock">
    <div class="row secondary">
      <div class="seg" id="viewSeg" role="group" aria-label="View">
        <button data-view="processed" aria-pressed="true">Processed</button>
        <button data-view="normal" aria-pressed="false">Normal</button>
      </div>
      <div class="group">
        <button class="btn" id="invertBtn" aria-pressed="false">Invert</button>
        <button class="btn" id="adjustBtn" aria-pressed="false" aria-controls="panel" hidden>Adjust</button>
      </div>
    </div>

    <div class="row primary">
      <button class="btn" id="flipBtn" disabled>Flip</button>
      <button class="shutter" id="saveBtn" aria-label="Save frame" disabled></button>
      <button class="btn" id="freezeBtn" disabled>Freeze</button>
    </div>

    <div class="panel" id="panel" hidden>
      <div class="ctl" id="torchCtl" hidden>
        <div class="head"><span class="lbl">Light</span><button class="btn small" id="torchBtn" aria-pressed="false">Torch</button></div>
      </div>
      <div class="ctl" id="zoomCtl" hidden>
        <div class="head"><label for="zoom">Zoom</label><span class="val" id="zoomVal">1.0×</span></div>
        <input type="range" id="zoom" min="1" max="1" step="0.1" value="1">
      </div>
    </div>
  </div>
</div>

<div class="preview" id="preview" hidden>
  <div class="imgs" id="previewImgs"></div>
  <p id="previewText">Long-press an image to save it to Photos.</p>
  <button class="btn" id="previewClose">Close</button>
</div>

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const video = $('#src'), view = $('#view'), vctx = view.getContext('2d');
const work = document.createElement('canvas'), wctx = work.getContext('2d', {willReadFrequently:true});
const NC = 512, NF = 16384;                // coarse / fine histogram bins
const coarse = new Uint32Array(NC), fine = new Uint32Array(NF), lut = new Float32Array(NF);
let ratio = new Float32Array(0);
let raf = 0, needsRender = false;

const st = {
  stream:null, track:null, facing:'environment', mirror:false, running:false, frozen:false,
  view:'processed', invert:false, invalidPct:0,
  fmin:NaN, fmax:NaN, lutReady:false,      // smoothed equalization range + LUT state
  frames:0, fpsT:0, fps:0
};

/* ---------- camera ---------- */
async function start(){
  if(!window.isSecureContext){ fail('This page must be served over HTTPS (or localhost) for the camera to work.'); return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ fail('This browser does not expose the camera API.'); return; }
  stopStream();
  try{
    st.stream = await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{ facingMode:{ideal:st.facing}, width:{ideal:1280}, height:{ideal:720} }
    });
  }catch(e){
    const msg = e && e.name === 'NotAllowedError'
      ? 'Camera access was blocked. If this page is embedded, open it in its own Safari tab; then check Settings › Safari › Camera.'
      : (e && e.name === 'NotFoundError' ? 'No camera was found on this device.' : 'Could not open the camera: ' + (e && e.message || e));
    fail(msg); return;
  }
  video.srcObject = st.stream;
  try{ await video.play(); }catch(e){}
  st.track = st.stream.getVideoTracks()[0];
  const settings = (st.track.getSettings && st.track.getSettings()) || {};
  const facing = settings.facingMode || st.facing;
  st.mirror = facing === 'user';           // mirror the selfie camera like the native Camera app
  setupTrackControls();
  $('#notice').hidden = true;
  $('#flipBtn').disabled = $('#saveBtn').disabled = $('#freezeBtn').disabled = false;
  st.running = true; st.frozen = false; $('#freezeBtn').textContent = 'Freeze'; $('#freezeBtn').setAttribute('aria-pressed','false');
  resetEq();
  requestWakeLock();
  cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
}
function fail(msg){
  const t = $('#noticeText'); t.textContent = msg; t.classList.add('err');
  $('#notice').hidden = false; $('#startBtn').textContent = 'Try again';
}
function stopStream(){
  if(st.stream){ st.stream.getTracks().forEach(t => t.stop()); st.stream = null; st.track = null; }
}
function setupTrackControls(){
  const caps = (st.track && st.track.getCapabilities) ? st.track.getCapabilities() : {};
  const hasTorch = !!caps.torch;
  const hasZoom = !!(caps.zoom && caps.zoom.max > caps.zoom.min);
  $('#torchCtl').hidden = !hasTorch; $('#torchBtn').setAttribute('aria-pressed','false');
  const zoom = $('#zoom');
  if(hasZoom){
    zoom.min = caps.zoom.min; zoom.max = caps.zoom.max; zoom.step = caps.zoom.step || 0.1;
    const cur = (st.track.getSettings && st.track.getSettings().zoom) || caps.zoom.min;
    zoom.value = cur; $('#zoomVal').textContent = Number(cur).toFixed(1) + '×';
  }
  $('#zoomCtl').hidden = !hasZoom;
  const any = hasTorch || hasZoom;
  $('#adjustBtn').hidden = !any;
  if(!any){ $('#panel').hidden = true; $('#adjustBtn').setAttribute('aria-pressed','false'); }
}
let wakeLock = null;
async function requestWakeLock(){
  try{ if('wakeLock' in navigator){ wakeLock = await navigator.wakeLock.request('screen'); } }catch(e){}
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && st.running) requestWakeLock(); });

/* ---------- processing ---------- */
function resetEq(){ st.fmin = st.fmax = NaN; st.lutReady = false; }
function loop(ts){
  if(!st.running) return;
  if(!st.frozen){
    if(video.readyState >= 2 && video.videoWidth) { process(true); tickFps(ts); }
  } else if(needsRender){ process(false); needsRender = false; }
  raf = requestAnimationFrame(loop);
}
function tickFps(ts){
  st.frames++;
  if(!st.fpsT) st.fpsT = ts;
  if(ts - st.fpsT >= 1000){ st.fps = Math.round(st.frames * 1000 / (ts - st.fpsT)); st.frames = 0; st.fpsT = ts; updateStats(); }
}
function grabFrame(pw, ph){
  if(st.mirror){
    wctx.save(); wctx.translate(pw, 0); wctx.scale(-1, 1);
    wctx.drawImage(video, 0, 0, pw, ph);
    wctx.restore();
  } else {
    wctx.drawImage(video, 0, 0, pw, ph);
  }
}
function process(grab){
  const pw = video.videoWidth, ph = video.videoHeight; if(!pw || !ph) return;
  if(work.width !== pw || work.height !== ph){
    work.width = pw; work.height = ph; ratio = new Float32Array(pw * ph); resetEq();
    if(!grab) return; // frozen frame lost on resize; wait for next live frame
  }
  if(view.width !== pw || view.height !== ph){ view.width = pw; view.height = ph; }
  if(grab) grabFrame(pw, ph);

  if(st.view === 'normal'){ vctx.drawImage(work, 0, 0); if(!grab) updateStats(); return; }

  const img = wctx.getImageData(0, 0, pw, ph), d = img.data, n = pw * ph;

  // pass 1: ratio, valid range, invalid count (R−G ≤ 0 → undefined)
  let vmin = Infinity, vmax = -Infinity, invalid = 0;
  for(let i = 0, j = 0; i < n; i++, j += 4){
    const den = d[j] - d[j+1];
    if(den <= 0){ ratio[i] = NaN; invalid++; continue; }
    const v = (d[j+1] - d[j+2]) / den;
    ratio[i] = v; if(v < vmin) vmin = v; if(v > vmax) vmax = v;
  }
  const nvalid = n - invalid; st.invalidPct = 100 * invalid / n;

  if(nvalid > 0){
    // pass 2: coarse histogram → robust range (0.5–99.5 pct) so the fine bins aren't wasted on ratio outliers
    coarse.fill(0);
    let cmin = Math.max(vmin, -64), cmax = Math.min(vmax, 64); if(cmax - cmin < 1e-3) cmax = cmin + 1e-3;
    const kc = NC / (cmax - cmin);
    for(let i = 0; i < n; i++){
      const v = ratio[i]; if(v !== v) continue;
      let b = ((v - cmin) * kc) | 0; if(b < 0) b = 0; else if(b >= NC) b = NC - 1; coarse[b]++;
    }
    const tLo = nvalid * 0.005, tHi = nvalid * 0.995;
    let acc = 0, bLo = 0, bHi = NC - 1;
    for(let b = 0; b < NC; b++){ acc += coarse[b]; if(acc >= tLo){ bLo = b; break; } }
    acc = 0;
    for(let b = 0; b < NC; b++){ acc += coarse[b]; if(acc >= tHi){ bHi = b; break; } }
    let rmin = cmin + bLo / kc, rmax = cmin + (bHi + 1) / kc; if(rmax - rmin < 1e-3) rmax = rmin + 1e-3;
    if(st.fmin !== st.fmin){ st.fmin = rmin; st.fmax = rmax; }
    else { st.fmin += (rmin - st.fmin) * 0.3; st.fmax += (rmax - st.fmax) * 0.3; }   // damp range jitter between frames

    // pass 3: fine histogram over the smoothed range → CDF → equalization LUT
    fine.fill(0);
    const fmin = st.fmin, kf = NF / (st.fmax - fmin);
    for(let i = 0; i < n; i++){
      const v = ratio[i]; if(v !== v) continue;
      let b = ((v - fmin) * kf) | 0; if(b < 0) b = 0; else if(b >= NF) b = NF - 1; fine[b]++;
    }
    let cdf = 0, cdfMin = -1;
    for(let b = 0; b < NF; b++){
      cdf += fine[b];
      if(cdfMin < 0 && cdf > 0) cdfMin = cdf;
      const y = cdfMin < 0 ? 0 : 255 * (cdf - cdfMin) / Math.max(1, nvalid - cdfMin);
      lut[b] = st.lutReady ? lut[b] + (y - lut[b]) * 0.5 : y;   // light temporal smoothing of the mapping
    }
    st.lutReady = true;

    // pass 4: write gray
    const inv = st.invert;
    for(let i = 0, j = 0; i < n; i++, j += 4){
      const v = ratio[i];
      let y;
      if(v !== v) y = 0;
      else {
        let b = ((v - fmin) * kf) | 0; if(b < 0) b = 0; else if(b >= NF) b = NF - 1;
        y = lut[b]; if(inv) y = 255 - y;
      }
      d[j] = d[j+1] = d[j+2] = y; d[j+3] = 255;
    }
  } else {
    for(let j = 0; j < d.length; j += 4){ d[j] = d[j+1] = d[j+2] = 0; d[j+3] = 255; }
  }
  vctx.putImageData(img, 0, 0);
  if(!grab) updateStats();
}
function updateStats(){
  $('#stats').innerHTML = `${work.width}×${work.height} · <b>${st.frozen ? 'frozen' : st.fps + ' fps'}</b>${st.mirror ? ' · mirrored' : ''}<br>undefined <b>${st.invalidPct.toFixed(1)}%</b>`;
}
function rerender(){ if(st.frozen) needsRender = true; }

/* ---------- controls ---------- */
$('#startBtn').addEventListener('click', start);
$('#flipBtn').addEventListener('click', () => { st.facing = st.facing === 'environment' ? 'user' : 'environment'; start(); });
$('#freezeBtn').addEventListener('click', () => {
  st.frozen = !st.frozen; $('#freezeBtn').textContent = st.frozen ? 'Resume' : 'Freeze';
  $('#freezeBtn').setAttribute('aria-pressed', String(st.frozen));
  updateStats();
});
function seg(id, attr, onPick){
  const el = $(id);
  el.addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    el.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    onPick(b.dataset[attr]);
  });
}
seg('#viewSeg', 'view', v => { st.view = v; rerender(); });
$('#adjustBtn').addEventListener('click', () => {
  const p = $('#panel'); p.hidden = !p.hidden; $('#adjustBtn').setAttribute('aria-pressed', String(!p.hidden));
});
$('#invertBtn').addEventListener('click', e => { st.invert = !st.invert; e.currentTarget.setAttribute('aria-pressed', String(st.invert)); rerender(); });
$('#torchBtn').addEventListener('click', async e => {
  if(!st.track) return;
  const on = e.currentTarget.getAttribute('aria-pressed') !== 'true';
  try{ await st.track.applyConstraints({advanced:[{torch:on}]}); e.currentTarget.setAttribute('aria-pressed', String(on)); }catch(err){}
});
$('#zoom').addEventListener('input', async e => {
  const z = parseFloat(e.target.value); $('#zoomVal').textContent = z.toFixed(1) + '×';
  if(st.track){ try{ await st.track.applyConstraints({advanced:[{zoom:z}]}); }catch(err){} }
});

/* ---------- save ---------- */
const toBlob = c => new Promise(r => c.toBlob(r, 'image/png'));
$('#saveBtn').addEventListener('click', async () => {
  if(!st.running || !work.width) return;
  const wasFrozen = st.frozen; st.frozen = true;
  const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  const files = [];
  const outBlob = await toBlob(view);
  files.push(new File([outBlob], `${st.view === 'processed' ? 'ratio' : 'rgb'}_${stamp}.png`, {type:'image/png'}));
  if(st.view === 'processed'){
    const rawBlob = await toBlob(work);
    files.push(new File([rawBlob], `rgb_${stamp}.png`, {type:'image/png'}));
  }
  st.frozen = wasFrozen;
  if(navigator.canShare && navigator.share && navigator.canShare({files})){
    try{ await navigator.share({files, title:'Ratio Viewfinder frame'}); return; }
    catch(e){ if(e && e.name === 'AbortError') return; }
  }
  let downloaded = false;
  try{
    files.forEach(f => {
      const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name;
      document.body.appendChild(a); a.click(); a.remove();
    });
    downloaded = true;
  }catch(e){}
  showPreview(files, downloaded);
});
function showPreview(files, downloaded){
  const box = $('#previewImgs'); box.innerHTML = '';
  files.forEach(f => { const im = document.createElement('img'); im.src = URL.createObjectURL(f); im.alt = f.name; box.appendChild(im); });
  $('#previewText').textContent = downloaded ? 'Saved to Downloads. If nothing arrived, long-press an image to save it to Photos.'
                                             : 'Long-press an image to save it to Photos.';
  $('#preview').hidden = false;
}
$('#previewClose').addEventListener('click', () => { $('#preview').hidden = true; $('#previewImgs').innerHTML = ''; });

window.addEventListener('pagehide', stopStream);
})();
</script>
</body>
</html>
